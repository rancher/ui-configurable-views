# Publish Configurable Views as a Rancher extension, to this repository's gh-pages branch.
#
# What Rancher consumes is a Helm repository: an index.yaml at the root of the branch, the
# chart archives under assets/, and the built extension under extensions/. Somebody installing
# it adds this repository's Pages URL under Extensions -> Manage Repositories, and the extension
# appears in Extensions like any other.
#
# The build is rancher/dashboard's own reusable workflow, pinned by SHA rather than tracked at
# @master: it is another repository's workflow running with write access to this one's
# branches. The tag beside the SHA is the shell version it belongs to; bump it together with
# @rancher/shell in package.json.
#
# Two things have to be true before the first run, and neither is something this workflow can
# arrange - see docs/RELEASING.md:
#
#   - the gh-pages branch has to exist. The publish script checks for it and stops rather than
#     creating it.
#   - GitHub Pages has to be serving that branch, since Rancher fetches the index without any
#     credential from the person installing it.
name: Build and Release Extension Charts

on:
  # Publish a release on main tagged `configurable-views-<version>`. The tag has to match the
  # package name and version or the build stops, which is what keeps the chart version and
  # package.json from drifting apart. The same release also builds the catalog image - see
  # build-extension-catalog.yml.
  #
  # There is deliberately no trigger on merging a version bump. Publishing without a release
  # left chart-releaser, inside the reusable workflow, to create the release itself: tagged on
  # the gh-pages build commit rather than on main, the only way a second version reached the
  # root index.yaml, and refused outright where releases are immutable, because it attaches the
  # chart after publishing the release.
  release:
    types: [released]
  # By hand, only from a release tag (Use workflow from -> Tags), to re-publish a version that
  # built wrong; a run from a branch stops at the first job. See docs/RELEASING.md.
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  # Publishing only ever starts from a release tag: the release itself, or a manual run started
  # from one. A run from a branch would build without the tag, so the root index.yaml would not
  # learn the version, and chart-releaser would create the release itself - which fails where
  # releases are immutable. Stop it here instead.
  require-tag:
    name: Started from a release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check the run was started from a release tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Start this from a release tag (Run workflow -> Use workflow from -> Tags), not from ${GITHUB_REF_NAME}. A new version is published by publishing a release."
          exit 1

  build-extension-charts:
    name: Build and publish the chart
    needs: require-tag
    uses: rancher/dashboard/.github/workflows/build-extension-charts.yml@9bf23dff6650116673346447bcf0b088e0edb27f # creators-pkg-v3.0.12
    permissions:
      contents: write
      pull-requests: write
    with:
      target_branch: gh-pages
      # Always a release tag here (see require-tag). It has to match the package name and
      # version, and a tagged build is what writes the new version into the root index.yaml.
      tagged_release: ${{ github.ref_name }}

  # Did anything actually get built?
  #
  # The publish script does not fail when the build under it does: it can publish a plugin
  # directory containing package.json and no JavaScript and still go green. Rancher then
  # installs that happily - the chart is well formed, the UIPlugin reaches Ready - and the
  # extension does nothing at all, because there is nothing to load. For this extension that
  # would look like the stock Home page and cluster dashboard showing, with no views bar.
  #
  # So this asks the only question that matters afterwards, of the branch rather than of the
  # build: is there a bundle on gh-pages for this version.
  verify-published:
    name: A bundle exists for this version
    needs: build-extension-charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - run: |
          version=$(node -p "require('./pkg/configurable-views/package.json').version")
          git fetch --depth=1 origin gh-pages
          files=$(git ls-tree -r --name-only origin/gh-pages "extensions/configurable-views/${version}/plugin" || true)
          echo "$files"

          if ! echo "$files" | grep -qE '\.js$'; then
            echo "::error::published ${version} has no JavaScript - the build failed and the publish swallowed it"
            exit 1
          fi

          echo "ok: $(echo "$files" | grep -cE '\.js$') javascript files published"
