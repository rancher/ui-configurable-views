# Publish the extension catalog image to ghcr.io.
#
# This is the air-gapped path: the same extension bundled into a container image, for clusters
# that cannot reach GitHub Pages to fetch the Helm repository that build-extension-charts.yml
# publishes.
#
# Pinned by SHA for the same reason as the charts workflow - it is another repository's
# workflow running with write access to this one's packages. The tag beside the SHA is the
# shell version it belongs to; bump it together with @rancher/shell in package.json.
#
# Publishing a release builds this and the chart together. A manual run started from a
# release tag rebuilds that version's image. See docs/RELEASING.md.
#
# The release tag has to match the ROOT package.json name and version, where the chart matches
# pkg/configurable-views/package.json. Both are named configurable-views; keep the two versions
# equal too, or no tag can satisfy both.
name: Build and Release Extension Catalog

on:
  release:
    types: [released]
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  # Publishing only ever starts from a release tag: the release itself, or a manual run started
  # from one. A run from a branch would push an image for whatever version package.json names,
  # with no release behind it. Stop it here instead.
  require-tag:
    name: Started from a release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check the run was started from a release tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Start this from a release tag (Run workflow -> Use workflow from -> Tags), not from ${GITHUB_REF_NAME}. A new version is published by publishing a release."
          exit 1

  build-extension-catalog:
    needs: require-tag
    name: Build and push the catalog image
    uses: rancher/dashboard/.github/workflows/build-extension-catalog.yml@9bf23dff6650116673346447bcf0b088e0edb27f # creators-pkg-v3.0.12
    permissions:
      actions: write
      contents: read
      packages: write
    with:
      registry_target: ghcr.io
      registry_user: ${{ github.actor }}
      # Always a release tag here (see require-tag). It has to match the ROOT package.json
      # name and version.
      tagged_release: ${{ github.ref_name }}
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}
